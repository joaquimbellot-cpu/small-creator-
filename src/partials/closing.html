<!-- Closing section, the same on every page that ends with it. Owner: Content Sections agent. -->
<section class="section closing">
  <div class="wrap">
    <h2 class="h2">{{site.closing.title}}</h2>
    <p class="lead">{{site.closing.lead}}</p>
    <p><a class="btn" href="{{site.cta.href}}">{{site.closing.button}}</a></p>
    <p class="small muted">{{site.closing.note}}</p>
  </div>
</section>
