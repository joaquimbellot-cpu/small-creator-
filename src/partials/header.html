<header class="site-header on-cream">
  <div class="wrap site-header__inner">
    <a class="site-header__logo" href="index.html" aria-label="{{site.labels.home}}">{{> logo}}</a>
    <nav class="site-nav" aria-label="{{site.labels.menu}}">
      <ul class="site-nav__list">
        {{#each site.nav}}
        <li><a class="site-nav__link label" href="{{href}}"{{#if current}} aria-current="page"{{/if}}>{{label}}</a></li>
        {{/each}}
      </ul>
    </nav>
    <a class="btn btn--small" href="{{site.cta.href}}"{{#if page.is.apply}} aria-current="page"{{/if}}>{{site.cta.label}}</a>
  </div>
</header>
