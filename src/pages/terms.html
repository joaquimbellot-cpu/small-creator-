<section class="section legal">
  <div class="wrap wrap--narrow">
    <div class="notice notice--draft legal__notice" data-reveal>
      <p><span class="chip">{{site.labels.draft}}</span></p>
      <p>{{terms.draftNotice}}</p>
    </div>
    <div class="legal__head">
      <h1 class="h1" data-reveal="lines">{{terms.title}}</h1>
      <p class="lead" data-reveal data-reveal-delay="1">{{terms.lead}}</p>
      <p class="small muted" data-reveal data-reveal-delay="2">{{terms.updated}}</p>
    </div>
    <div class="legal__body">
      {{#each terms.sections}}
      <section class="legal__section">
        <h2 class="h3">{{heading}}</h2>
        {{#each paragraphs}}
        <p class="body">{{{this}}}</p>
        {{/each}}
      </section>
      {{/each}}
    </div>
  </div>
</section>
