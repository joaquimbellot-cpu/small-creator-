<title>Smallfold Back Office Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap">
<style>
/* Layout: a top bar with the main tabs. List screens put a 280px filter rail beside the results.
   A record opens in a right side panel, with a full-page option. One light look on purpose:
   it mirrors the real back office, which has no dark mode. */
:root{
  --cream:#F1EFEB; --ink:#0E0E0E; --paper:#FAF8F4; --muted:#5C5A55; --faint:#B9B5AC;
  --line:rgba(14,14,14,.14); --accent:#2B44D6; --red:#9B2C1F; --green:#2F6B3C; --amber:#8A5A00;
  --d-bg:#0E0E0E; --d-surface:#1A1A19; --d-fg:#F1EFEB; --d-muted:#A9A59C; --d-line:rgba(241,239,235,.18); --d-accent:#A8B4FF;
  --s-long:#338ced; --s-shorts:#e76624;
  --veil:rgba(14,14,14,.45); --banner:#0E0E0E; --banner-fg:#F1EFEB; --banner-muted:#A9A59C;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --r:8px; --wrap:1320px;
  --gl:max(clamp(16px,4vw,56px),env(safe-area-inset-left,0px));
  --gr:max(clamp(16px,4vw,56px),env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font:400 1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:80;background:var(--banner)}
h1,h2,h3{font-family:var(--serif);font-weight:300;letter-spacing:-.01em;margin:0}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font:500 .75rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.875rem} .num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* prototype banner */
.banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--banner);color:var(--banner-fg)}
.banner__in{max-width:var(--wrap);margin:0 auto;padding:8px var(--gr) 8px var(--gl);display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap;font-size:.875rem}
.banner strong{font:600 .75rem/1.4 var(--sans);letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--banner-fg);border-radius:4px;padding:2px 8px;white-space:nowrap}
.banner span.m{color:var(--banner-muted)}
.banner select,.banner button{background:transparent;color:var(--banner-fg);border:1px solid var(--banner-muted);border-radius:6px;min-height:32px;padding:0 10px;font-size:.8125rem;cursor:pointer}
.banner select option{color:#0E0E0E}
.banner :focus-visible{outline-color:#A8B4FF}
.banner__in{position:relative}
.banner details:not([open]) ol{display:none}
.banner summary{cursor:pointer;text-decoration:underline;list-style:none}
.banner summary::-webkit-details-marker{display:none}
.banner details ol{position:absolute;left:var(--gl);top:100%;width:min(calc(100% - 32px),420px);margin:0;padding:16px 16px 16px 36px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);z-index:5}
.banner details li{margin-bottom:6px}

/* shell */
.bar{border-bottom:1px solid var(--line)}
.bar__in{max-width:var(--wrap);margin:0 auto;padding:0 var(--gr) 0 var(--gl);display:flex;align-items:center;gap:8px 24px;min-height:64px;flex-wrap:wrap}
.brand{display:inline-flex;gap:8px;align-items:center;font:300 1.5rem/1 var(--serif);text-decoration:none}
.brand i{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;font:400 .9rem/1 var(--serif);font-style:normal;position:relative}
.brand i::after{content:"";position:absolute;right:-1px;top:-1px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:var(--muted);font:500 .75rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.nav a.new::after{content:"New";margin-left:6px;font-size:.625rem;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
.who{text-align:right;font-size:.9375rem;line-height:1.2}
.who small{display:block;font:500 .6875rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.searchbtn{display:inline-flex;gap:10px;align-items:center;min-height:40px;padding:0 12px;background:var(--paper);border:1px solid var(--muted);border-radius:var(--r);color:var(--muted);cursor:pointer;font-size:.9375rem}
kbd{font:500 .6875rem/1 var(--sans);border:1px solid var(--line);border-radius:4px;padding:3px 5px;color:var(--muted);background:var(--cream)}
main{max-width:var(--wrap);margin:0 auto;padding:32px var(--gr) 72px var(--gl)}
@media (max-width:1040px){.bar__in{padding-top:8px}.nav{order:3;flex:1 0 100%}.who{margin-left:auto}}
@media (max-width:700px){.banner{position:static}}

/* page */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-title{font-size:clamp(1.75rem,3vw,2.5rem);line-height:1.1}
.page-lead{color:var(--muted);max-width:34em;margin-top:8px}
.addr{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:8px 12px;border:1px dashed var(--faint);border-radius:var(--r);margin-bottom:24px;font-size:.875rem}
.addr code{font:400 .8125rem/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-wrap:anywhere;flex:1;min-width:0}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;align-items:start}
.results{min-width:0}

/* buttons, fields, badges */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:1px solid var(--ink);border-radius:var(--r);background:var(--ink);color:var(--cream);font:500 .75rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;cursor:pointer;text-decoration:none;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--muted)}
.btn.ghost:hover{border-color:var(--ink);background:var(--paper)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red);color:var(--cream)}
.btn.sm{min-height:40px;padding:0 16px}
.btn.xs{min-height:36px;padding:0 12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;text-align:left}
.link.blue{color:var(--accent)}
.control{width:100%;min-height:52px;padding:0 16px;background:var(--paper);color:var(--ink);border:1px solid var(--muted);border-radius:var(--r)}
.control.sm{min-height:40px;padding:0 12px;font-size:.9375rem}
textarea.control{padding:12px 16px;min-height:120px;resize:vertical;line-height:1.5}
select.control{appearance:none;-webkit-appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.field{display:grid;gap:4px;margin-bottom:16px}
.field .hint{font-size:.875rem;color:var(--muted)}
.two{display:grid;gap:0 16px}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;border:1px solid var(--line);font:500 .75rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.badge.accent{color:var(--accent);border-color:var(--accent)} .badge.good{color:var(--green);border-color:var(--green)}
.badge.warn{color:var(--amber);border-color:var(--amber)} .badge.bad{color:var(--red);border-color:var(--red)}
.badge.confirmed{color:var(--green);border-color:var(--green)}
.badge.detected{color:var(--amber);border-color:var(--amber);border-style:dashed}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:.8125rem;color:var(--muted);white-space:nowrap}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.notice{padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-size:.9375rem;margin-bottom:16px}
.notice.error{border-color:var(--red)} .notice.warn{border-color:var(--amber)} .notice.success{border-color:var(--green)}

/* filter rail */
.rail{border-top:1px solid var(--line)}
.rail__head{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.rail details{border-bottom:1px solid var(--line)}
.rail summary{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;cursor:pointer;list-style:none}
.rail summary::-webkit-details-marker{display:none}
.rail summary::after{content:"+";color:var(--muted);font-size:1.125rem;line-height:1}
.rail details[open]>summary::after{content:"\2212"}
.rail summary .on{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:auto}
.rail .body{padding:0 0 16px}
.opt{display:flex;gap:10px;align-items:center;min-height:36px;cursor:pointer;font-size:.9375rem}
.opt span.t{flex:1;min-width:0}
.opt .cnt{color:var(--muted);font-size:.8125rem;font-variant-numeric:tabular-nums}
.opt.zero span.t,.opt.zero .cnt{color:var(--faint)}
.scroll{position:relative;max-height:196px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;margin-top:8px;background:var(--paper)}
.seg{display:flex;border:1px solid var(--muted);border-radius:var(--r);overflow:hidden}
.seg label{flex:1;text-align:center;cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.seg span{display:block;padding:9px 6px;font-size:.875rem;border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--ink);color:var(--cream)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-3px}
.seg small{opacity:.7;font-variant-numeric:tabular-nums}
.dual{position:relative;height:36px;margin:4px 0 8px}
.dual .track,.dual .fill{position:absolute;top:17px;height:2px}
.dual .track{left:0;right:0;background:var(--faint)}
.dual .fill{background:var(--ink)}
.dual input{position:absolute;left:0;top:0;width:100%;height:36px;margin:0;padding:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none;accent-color:auto}
.dual input::-webkit-slider-runnable-track{background:none;height:36px}
.dual input::-moz-range-track{background:none;height:2px}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;margin-top:7px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);cursor:grab}
.dual input::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);cursor:grab}
.dual input:focus-visible{outline:none}
.dual input:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:3px}
.dual input:focus-visible::-moz-range-thumb{outline:2px solid var(--accent);outline-offset:3px}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:10px}
.minmax{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 6px 0 12px;border:1px solid var(--muted);border-radius:999px;background:var(--paper);font-size:.875rem}
.chip button{width:24px;height:24px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:1rem;line-height:1;color:var(--muted)}
.chip button:hover{background:var(--ink);color:var(--cream)}
.pre{min-height:32px;padding:0 12px;border:1px solid var(--muted);border-radius:999px;background:transparent;font-size:.8125rem;cursor:pointer}
.pre[aria-pressed=true]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.filterbtn{display:none}
@media (max-width:899px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .filterbtn{display:inline-flex}
  .rail{display:none}
  .rail.open{display:block;position:fixed;inset:0 auto 0 0;z-index:45;width:min(92vw,340px);background:var(--cream);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);border-top:0}
  .railveil{position:fixed;inset:0;background:var(--veil);z-index:44}
}
@media (min-width:900px){.railclose,.railveil{display:none}}

/* results */
.tools{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.count{font:300 1.375rem/1.2 var(--serif)}
.tools select.control{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bulk{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--ink);border-radius:var(--r);background:var(--paper);margin-bottom:12px;font-size:.9375rem}
.bulk select.control{width:auto;max-width:210px}
.tw{border-top:1px solid var(--line);overflow-x:auto;position:relative}
td.name{min-width:10.5rem} td.sp{min-width:9.5rem} td.nw{white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:.9375rem;line-height:1.4}
th{text-align:left;padding:12px;font:500 .75rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr:hover{background:var(--paper)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;color:var(--muted);font-size:.8125rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:grid;gap:8px;align-content:start;cursor:pointer}
.card h3{font-size:1.25rem;line-height:1.2}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:.875rem}
.pager{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-size:.9375rem;color:var(--muted)}
.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty h2{font-size:1.5rem;color:var(--ink);margin-bottom:8px}
.empty .row{justify-content:center;margin-top:16px}
.skel td span{display:block;height:14px;border-radius:4px;background:var(--line);animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.skel td span{animation:none}*{transition:none!important}}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:min(86vw,340px);background:var(--paper);border:1px solid var(--muted);border-radius:var(--r);padding:8px}
.pop button.item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;cursor:pointer;font-size:.9375rem}
.pop button.item:hover{background:var(--cream)}
.pop hr{border:0;border-top:1px solid var(--line);margin:8px 0}
details.why summary{cursor:pointer;white-space:nowrap}
.band{font:500 .75rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase}
.band.strong{color:var(--green)} .band.possible{color:var(--amber)} .band.weak{color:var(--muted)}

/* profile */
.overlay{position:fixed;inset:0;background:var(--veil);z-index:40}
.panel{position:fixed;inset:0 0 0 auto;z-index:41;width:min(100%,680px);background:var(--cream);border-left:1px solid var(--line);display:flex;flex-direction:column}
.panel__head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px 20px;border-bottom:1px solid var(--line)}
.panel__body{overflow-y:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 20px}
.x{width:44px;height:44px;border:0;background:none;font-size:1.5rem;cursor:pointer;border-radius:var(--r)}
.phead h2{font-size:clamp(1.625rem,3vw,2.25rem);line-height:1.1}
.dl{display:grid;grid-template-columns:minmax(0,10rem) 1fr;gap:8px 16px;margin:16px 0}
.dl dt{font:500 .75rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.dl{grid-template-columns:1fr;gap:2px 0}.dl dd{margin-bottom:8px}}
.sec{border-top:1px solid var(--line);padding:20px 0}
.sec>h3{font-size:1.375rem;margin-bottom:12px}
.sec__head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec__head h3{font-size:1.375rem}
.tl{list-style:none;margin:0;padding:0;border-left:1px solid var(--faint);margin-left:5px}
.tl li{position:relative;padding:0 0 20px 20px}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--cream)}
.tl li.det::before{background:var(--cream);border:2px dashed var(--amber)}
.tl .when{font:500 .75rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tl .what{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0}
.sug{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:14px;margin-bottom:12px}
.sug__head{display:flex;justify-content:space-between;gap:8px 12px;align-items:baseline;flex-wrap:wrap}
.meter{height:4px;background:var(--line);border-radius:2px;margin:8px 0;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.reasons{list-style:none;margin:0 0 10px;padding:0;font-size:.9375rem}
.reasons li{display:grid;grid-template-columns:2.6rem 1fr;gap:8px;padding:3px 0}
.reasons .p{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.pgrid{display:grid;gap:0 40px}
@media (min-width:1000px){.pgrid{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.person{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9375rem}

/* board */
.board{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);min-height:160px}
.col.over{border-color:var(--accent)}
.col__head{padding:10px 12px;border-bottom:1px solid var(--line)}
.col__body{padding:8px;display:grid;gap:8px}
.deal{position:relative;background:var(--cream);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:.875rem;display:grid;gap:6px;cursor:grab}
.deal.flash{border-color:var(--accent)}
.deal select{min-height:36px;font-size:.8125rem;padding-left:8px}

/* earnings calculator, on the brand's dark ground */
.subnav{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.subnav a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 0;color:var(--muted);font-size:.9375rem;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subnav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.subnav a small{font:500 .625rem/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px}

/* ---------- pitch draft ---------- */
function draftFor(c, s, to) {
  const used = [], out = [], nn = NICHES[c.niche].toLowerCase(), inRange = c.subs >= s.target[0] && c.subs <= s.target[1];
  const conf = c._conf.filter(x => x.s && x.s !== s.id), names = [...new Set(conf.map(x => SPN(x.s).name))].slice(0, 2);
  const det = c._all.filter(x => x.label === 'detected');
  const sim = [...new Set(s._conf.filter(x => x.c !== c.id && CR(x.c).niche === c.niche).map(x => x.c))].length;
  used.push(`Subscribers: ${num(c.subs)} (checked ${rel(c.checked).toLowerCase()})`, `Niche: ${NICHES[c.niche]}`, `Sponsor's target size: ${short(s.target[0])} to ${short(s.target[1])} subscribers`);
  conf.slice(0, 2).forEach(x => used.push(`Confirmed sponsorship: ${SPN(x.s).name}, ${monYear(x.date)} (confirmed by ${x.by})`));
  if (sim) used.push(`${s.name} sponsored ${sim} other ${nn} ${sim === 1 ? 'channel' : 'channels'} (confirmed)`);
  det.slice(0, 3).forEach(x => out.push(`Detected sponsorship: ${x.s ? SPN(x.s).name : 'brand not named'}, ${monYear(x.date)} (not confirmed)`));
  out.push('Prices and budgets (never in a first email)', 'Ad earnings estimates (an estimate is not a fact)', "The creator's email, phone and notes (Claude never receives them)");
  const hist = names.length ? (names.length === 2 ? `${names[0]} and ${names[1]}` : names[0]) : null;
  const foot = `\n\n${STAFF[S.role]}\nSmallfold · [sender postal address from Settings]\nIf you would rather not hear from us, use this link and we will not write again: [opt-out link]`;
  let subject, body;
  if (to === 'creator') {
    subject = `A sponsor that fits ${c.channel}: ${s.name}`;
    body = `Hi ${c.first},\n\nI'm ${STAFF[S.role].split(' ')[0]} from Smallfold. We connect small YouTube channels with sponsors and handle the back and forth for you.\n\n${s.name} is looking for ${nn} channels with ${short(s.target[0])} to ${short(s.target[1])} subscribers. ${c.channel} has ${num(c.subs)} subscribers${inRange ? ', so it is the size they ask for' : ''}.${hist ? `\n\nYou have already worked with ${hist}, so you know how a sponsored video works.` : ''}${sim ? `\n\n${s.name} has sponsored ${sim} other ${nn} ${sim === 1 ? 'channel' : 'channels'} before.` : ''}\n\nWould you like to hear more? A short reply is enough.` + foot;
  } else {
    const p = s.contacts[0]; used.push(`Average views: ${num(c.avgViews)} over the last 20 videos`);
    subject = `A ${nn} channel for ${s.name}: ${c.channel}`;
    body = `Hi ${p ? p.first : '[contact name]'},\n\nI'm ${STAFF[S.role].split(' ')[0]} from Smallfold. We connect brands with small YouTube channels and handle the back and forth.\n\n${c.channel} is a ${nn} channel with ${num(c.subs)} subscribers and about ${num(c.avgViews)} views per video${inRange ? `, inside the size ${s.name} usually works with` : ''}.${hist ? `\n\nThe channel has completed sponsorships with ${hist}.` : ''}${sim ? `\n\nYou have sponsored ${sim} similar ${sim === 1 ? 'channel' : 'channels'} before, so the audience should feel familiar.` : ''}\n\nIf this sounds useful, I can send more detail and set up an introduction.` + foot;
  }
  return { subject, body, used, out };
}
