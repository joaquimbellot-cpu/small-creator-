# Netlify: the website and the back office are one Next.js app in admin/ (see admin/README.md).
# Netlify's Next.js runtime is added automatically. Settings and keys go in the Netlify UI, never here.
[build]
  base = "admin"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js runtime (turns the app's pages, API routes and proxy into functions).
# Named here because a project created through the API may not add it on its own. No version pin.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The website's images, stylesheet and script (admin/public/assets). They skip the app's proxy (see admin/proxy.ts),
# so their headers are set here. A browser keeps them for an hour and may show an older copy for a day while it
# fetches the new one, so a repeat visit does not wait for the server.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
