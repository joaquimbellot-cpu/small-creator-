# Netlify: the website and the back office are one Next.js app in admin/ (see admin/README.md).
# Netlify's Next.js runtime is added automatically. Settings and keys go in the Netlify UI, never here.
[build]
  base = "admin"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js runtime (turns the app's pages, API routes and proxy into functions).
# Named here because a project created through the API may not add it on its own. No version pin.
[[plugins]]
  package = "@netlify/plugin-nextjs"
