<style>
@font-face{font-family:"Anton";src:url(../fonts/anton-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"DM Serif Display";src:url(../fonts/dm-serif-display-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:block}

/* ---- format tokens (one file, two sizes) ---- */
:root{--W:1080px;--H:1350px;--mx:64px;--top:64px;--bottom:64px;}
html.f-9x16{--H:1920px;--top:280px;--bottom:384px;} /* top 14% = 269px, bottom 20% = 384px */

/* ---- colour themes: set ONE on .poster ---- */
.t-cream  {--bg:#F1EFEB;--fg:#0E0E0E;--blue:#2B44D6;--tint:#E2DFD8}
.t-yellow {--bg:#FFD400;--fg:#0E0E0E;--blue:#2B44D6;--tint:#F2C800}
.t-pink   {--bg:#FFB4C8;--fg:#0E0E0E;--blue:#2B44D6;--tint:#F59DB6}
.t-ink    {--bg:#0E0E0E;--fg:#F1EFEB;--blue:#A8B4FF;--tint:#1E1E1E}
.t-forest {--bg:#0B4A34;--fg:#F1EFEB;--blue:#A8B4FF;--tint:#0F5C42}
.t-oxblood{--bg:#7A1426;--fg:#F1EFEB;--blue:#A8B4FF;--tint:#921A31}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#888}
body{width:var(--W);height:var(--H);overflow:hidden}
.poster{position:relative;width:var(--W);height:var(--H);padding:var(--top) var(--mx) var(--bottom);display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Archivo Narrow",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

/* ---- type roles ---- */
.display{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.92;letter-spacing:-.005em;white-space:nowrap}
.wit{font-family:"DM Serif Display",Georgia,serif;font-style:italic;font-weight:400;line-height:1.08;letter-spacing:-.005em}
.small{font-family:"Archivo Narrow",sans-serif;font-weight:500;font-size:24px;line-height:1.2;letter-spacing:.01em}

/* ---- the blank: a pen-blue bar sitting on the baseline ---- */
.blank{display:inline-block;width:var(--bw,3.2em);height:var(--bh,.22em);background:var(--blue);border-radius:var(--br,.04em);vertical-align:baseline}

/* ---- support line ---- */
.support{font-size:52px;margin-top:40px}
.support b{font-weight:400;font-style:normal}

/* ---- footer strip ---- */
.foot{margin-top:36px;border-top:3px solid var(--fg);padding-top:20px}
.foot .r1{display:flex;align-items:center;justify-content:space-between;height:50px}
.foot .logo{height:46px;width:auto;display:none}
.t-cream .logo-light,.t-yellow .logo-light,.t-pink .logo-light{display:block}
.t-ink .logo-ink,.t-forest .logo-ink,.t-oxblood .logo-ink{display:block}
.foot .apply{font-weight:700;font-size:30px;letter-spacing:.01em;white-space:nowrap}
.foot .apply span{color:var(--blue)}
.foot .r2{display:flex;justify-content:space-between;margin-top:14px;font-size:24px;line-height:1.2}
.foot .ai{white-space:nowrap}


.stage{position:static;display:flex;flex-direction:column;justify-content:space-between}
.stage > .grow{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.foot .apply span{display:inline-block;background:var(--blue);color:var(--bg);padding:0 16px 3px;line-height:1.3;margin-right:6px}
.foot .r2{font-size:26px;font-weight:700;letter-spacing:.01em}
.support{margin-top:24px}
.base{display:none;position:absolute;left:0;right:0}
html.f-9x16 .base{display:block;top:1572px;bottom:0}

.sky{position:absolute;left:0;right:0;top:0;height:572px;background:#FFD400}
html.f-9x16 .sky{height:782px}
.base{background:#FFD400}
.base::before,.base::after{content:"";position:absolute;left:0;right:0;height:64px;background:repeating-linear-gradient(to right,#0E0E0E 0 64px,transparent 64px 112px);left:24px}
.base::before{top:90px}
.base::after{top:230px}
.title{position:relative;color:#0E0E0E}
.title .big{font-size:520px;line-height:.78;margin-left:-8px;margin-top:6px;display:block}
.title .tag{font-size:46px;margin-top:26px}
html.f-9x16 .title .big{margin-top:0}
.bill{display:flex;flex-direction:column;align-items:center;margin-top:22px}
.bill .cr{font-size:44px;letter-spacing:.14em;line-height:1.02;text-align:center;padding-left:.14em}
.bill .rule{width:100%;height:2px;background:rgba(241,239,235,.4);margin:8px 0 6px}
.bill .sp{width:100%;font-size:112px;display:flex;align-items:baseline;gap:.12em;border-top:6px solid var(--fg);padding-top:22px;margin-top:18px}
.bill .sp .blank{flex:1;height:.46em;--br:.02em}
html.f-9x16 .bill{margin-top:24px}
html.f-9x16 .bill .cr{font-size:54px;line-height:1.12}
html.f-9x16 .bill .rule{margin:10px 0 8px}


/* after the critic's check: larger legal line, footer lifted clear of the bottom safe zone */
.foot .r2{font-size:28px}
html.f-9x16{--bottom:406px}
/* 9:16: the title starts inside the safe zone */
html.f-9x16{--top:300px}
html.f-9x16 .sky{height:802px}
</style>
